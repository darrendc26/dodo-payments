services:
  db:
    image: postgres:15-alpine
    container_name: dodo_payments_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-psp:
    build:
      context: .
      dockerfile: Dockerfile.mock-psp
    container_name: dodo_payments_mock_psp
    ports:
      - "${PSP_PORT}:${PSP_PORT}"
    environment:
      - PORT=${PSP_PORT}
      - RUST_LOG=info
    restart: always

  invoice-service:
    build:
      context: .
      dockerfile: Dockerfile.invoice-service
    container_name: dodo_payments_invoice_service
    ports:
      - "${PORT}:${PORT}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PSP_URL=${PSP_URL}
      - PORT=${PORT}
      - RUST_LOG=info
    depends_on:
      db:
        condition: service_healthy
      mock-psp:
        condition: service_started
    restart: always

volumes:
  postgres_data:
