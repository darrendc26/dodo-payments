openapi: 3.0.0
info:
  title: Dodo Payments Invoice & Payment Service API
  version: 1.0.0
  description: API for managing businesses, customers, invoices, payments, and webhook configurations.

servers:
  - url: http://localhost:8080
    description: Local Invoice Service

security:
  - ApiKeyAuth: []

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy

  /businesses:
    post:
      summary: Register a new business (Public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Acme Corp"
      responses:
        '200':
          description: Business created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  api_key:
                    type: string
                    description: Plaintext API key. Only shown once!
                    example: "dodo_sk_live_abc123..."

  /customers:
    post:
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
      responses:
        '200':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

    get:
      summary: List customers
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /customers/{id}:
    get:
      summary: Get customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /invoices:
    post:
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - due_date
                - items
              properties:
                customer_id:
                  type: string
                  format: uuid
                due_date:
                  type: string
                  format: date-time
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - description
                      - quantity
                      - unit_amount_cents
                    properties:
                      description:
                        type: string
                        example: "Widget A"
                      quantity:
                        type: integer
                        example: 2
                      unit_amount_cents:
                        type: integer
                        format: int64
                        example: 500
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    get:
      summary: List invoices
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, open, paid, void, uncollectible]
      responses:
        '200':
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /invoices/{id}:
    get:
      summary: Get invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice details with line items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /invoices/{id}/pay:
    post:
      summary: Pay an invoice
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - card_token
              properties:
                card_token:
                  type: string
                  example: "tok_success"
      responses:
        '200':
          description: Payment attempt succeeded or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttemptResult'
        '202':
          description: Payment is pending (timed out at PSP or network error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttemptResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Conflict. A payment attempt is already in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable. Invoice is not in 'open' status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invoices/{id}/void:
    post:
      summary: Void an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice voided successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /invoices/{id}/uncollectible:
    post:
      summary: Mark invoice as uncollectible
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice marked uncollectible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /webhooks/endpoints:
    post:
      summary: Register webhook endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  example: "https://my-service.com/webhooks"
      responses:
        '201':
          description: Webhook endpoint registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    get:
      summary: List webhook endpoints
      responses:
        '200':
          description: List of registered endpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookEndpoint'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: Use plain API keys issued during business creation.

  responses:
    BadRequestError:
      description: Invalid request parameters or body mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Resource state collision or duplicate email
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntityError:
      description: Invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "BAD_REQUEST"
            message:
              type: string
              example: "Detailed error message"

    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Jane Doe"
        email:
          type: string
          example: "jane.doe@example.com"
        created_at:
          type: string
          format: date-time

    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, open, paid, void, uncollectible]
          example: "open"
        amount_cents:
          type: integer
          format: int64
          description: Invoice total in USD cents
          example: 1000
        due_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              description:
                type: string
              quantity:
                type: integer
              unit_amount_cents:
                type: integer
                format: int64

    PaymentAttemptResult:
      type: object
      properties:
        status:
          type: string
          enum: [succeeded, failed, pending]
          example: "succeeded"
        payment_attempt_id:
          type: string
          format: uuid
        psp_reference:
          type: string
          nullable: true
          example: "3b290941-bd56-4c4f-9e79-bb7d11f71df4"
        error_code:
          type: string
          nullable: true
          example: "insufficient_funds"

    WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        secret:
          type: string
          description: HMAC-SHA256 signing secret
          example: "whsec_..."
        created_at:
          type: string
          format: date-time
